[package]
name = "classifier"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "init-db"
path = "src/bin/init_db.rs"

[dependencies]
axum = "0.8.9"
hex = "0.4.3"
icu_properties = "2.2.0"
regex = "1.13.0"
rusqlite = { version = "0.40.1", features = ["bundled", "hooks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
time = { version = "0.3.53", features = ["formatting"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "sync"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.25"
unicode-script = "0.5.8"
uuid = { version = "1.23.5", features = ["v4"] }
